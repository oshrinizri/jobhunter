name: Scan jobs

on:
  schedule:
    # Wakes up at the four scan slots, every day: 07, 12, 17, 21 Israel time.
    # (04:30/09:30/14:30/18:30 UTC ≈ 06:30–07:30 etc. across winter/summer time; the script snaps to the nearest slot.)
    # Whether a slot actually scans is decided per user in the app's Settings → "סריקה אוטומטית".
    # A skipped slot exits in seconds (no AI calls) and still keeps the free Supabase project awake.
    - cron: "30 4 * * *"
    - cron: "30 9 * * *"
    - cron: "30 14 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/ingest.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAX_SCORE_PER_RUN: "150"
          # "Run workflow" by hand always scans, whatever the schedule says.
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
